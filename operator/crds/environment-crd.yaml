apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: environments.idp.platform.io
spec:
  group: idp.platform.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                appName:
                  type: string
                owner:
                  type: string
                tier:
                  type: string
                  enum: [dev, staging, prod]
                database:
                  type: boolean
                replicas:
                  type: integer
                  minimum: 1
              required: ["appName", "owner", "tier"]
            status:
              type: object
              properties:
                phase:
                  type: string
                namespace:
                  type: string
                message:
                  type: string
  scope: Cluster
  names:
    plural: environments
    singular: environment
    kind: Environment
    shortNames:
    - env
